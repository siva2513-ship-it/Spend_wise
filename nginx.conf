server {
    listen 10000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast Flutter Web asset delivery
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Client-side routing: redirect unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proper MIME types and caching for WebAssembly
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NEVER cache index.html, bootstrap scripts, service workers, main.dart.js, or version.json
    # Ensures new builds and currency updates deploy to browsers immediately without stale cache
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Cache immutable static assets in subfolders (assets, canvaskit, icons)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
