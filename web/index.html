<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SpendWise – Personal Expense Tracker (INR - ₹). 100% Client-Side Offline-Ready Expense Management.">
  <meta name="theme-color" content="#0F766E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpendWise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SpendWise – Personal Expense Tracker (₹ INR)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #F8FAFC;
    }
    .logo-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #0F766E, #14B8A6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.4);
      margin-bottom: 20px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14B8A6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-size: 14px;
      font-weight: 500;
      color: #94A3B8;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Ensure any previously installed service worker caches are cleared immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="logo-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
        <path d="M4 6v12a2 2 0 0 0 2 2h14v-4"></path>
        <circle cx="16" cy="14" r="2"></circle>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Loading SpendWise (₹ INR)...</div>
  </div>

  <script src="flutter_bootstrap.js?v=inr_release_3" async></script>
</body>
</html>
